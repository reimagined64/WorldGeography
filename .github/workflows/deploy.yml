# Publish to GitHub Pages the artifact CI tested — never a fresh build.
#
# Requires Settings -> Pages -> Source = "GitHub Actions". No branch is
# published; the site is exactly the `dist/` CI uploaded.
#
# R27 and KTD18 are one sentence: the deployed artifact's sha256 equals the
# sha256 of the artifact the suites ran against. This workflow does not build.
# It takes the artifact CI produced, re-checks the digest CI recorded inside
# it, smoke-tests it, and publishes.
#
# ## Why this is called rather than triggered
#
# It was `on: workflow_run` at first, and that does not work. A `workflow_run`
# job executes in the context of the repository's *default* branch — `develop`
# here — whatever branch the run that triggered it was on. The `github-pages`
# environment allows deployments from `main` and only `main`, which is the
# right rule, so every such run was rejected at the environment gate after
# doing all of its work:
#
#     Branch "develop" is not allowed to deploy to github-pages
#     due to environment protection rules.
#
# A reusable workflow runs in the *caller's* context, so when `ci.yml` calls
# this on a push to `main`, `github.ref` is `refs/heads/main` and the rule is
# satisfied by the branch that genuinely produced the artifact. It is also
# simpler: the artifact is in the calling run, so there is no cross-run
# download and no window in which CI's artifact could expire.
#
# `workflow_dispatch` stays, and is the rollback: give it the id of an earlier
# green CI run and that run's artifact goes live again, byte for byte.
name: Deploy to GitHub Pages

on:
  # Called by `ci.yml` after the suites pass on `main`.
  workflow_call:
  workflow_dispatch:
    inputs:
      run_id:
        description: >-
          The CI run whose artifact to publish. Leave blank for the most recent
          successful CI run on main. This is the rollback: put in the run id of
          the last good deploy and it goes live again, byte for byte.
        required: false
        type: string

permissions:
  contents: read
  # Reading another workflow run's artifact needs this; nothing else here does.
  actions: read
  pages: write
  id-token: write

# One publish at a time, and never cancel one in flight: a half-applied Pages
# deployment is worse than a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    name: Publish the tested artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No condition: the caller decides whether this runs at all, and the manual
    # path is somebody typing a run id on purpose. A guard here would be a
    # second opinion about a decision already made, in a place where getting it
    # wrong means silently not deploying.
    #
    # `actions/deploy-pages` requires this environment; it is also what puts
    # the live URL on the run summary and in the Environments tab.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Choose the CI run to publish
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != 'workflow_dispatch' ]; then
            # Called by CI: the artifact was uploaded by an earlier job of this
            # very run, and `github.sha` is the commit those jobs tested.
            run_id="$GITHUB_RUN_ID"
            sha="$GITHUB_SHA"
          else
            if [ -n "${INPUT_RUN_ID:-}" ]; then
              run_id="$INPUT_RUN_ID"
            else
              # The most recent green CI run on main, which is what "redeploy
              # the current site" means when nobody names a run.
              run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow CI \
                --branch main --status success --limit 1 --json databaseId \
                --jq '.[0].databaseId')"
            fi
            [ -n "$run_id" ] && [ "$run_id" != "null" ] || { echo "No successful CI run to publish"; exit 1; }
            sha="$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json headSha --jq .headSha)"
          fi

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "commit=$sha" >> "$GITHUB_OUTPUT"
          echo "Publishing artifact from CI run $run_id (commit $sha)"

      # The commit CI tested, not the default branch's head: the smoke test
      # below runs this repository's own `assertSelfContained` against the
      # downloaded document, and it has to be the version that produced it.
      - name: Check out the commit CI tested
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.commit }}

      - name: Use the pinned Node version
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Download the tested artifact
        uses: actions/download-artifact@v4
        with:
          name: site
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ github.token }}

      # R27. `dist-sha256.txt` was written by the job that ran the suites,
      # inside the artifact, so this compares what is about to go live against
      # what was tested rather than against a number typed somewhere else.
      - name: Verify the artifact against the digest CI recorded
        id: verify
        run: |
          set -euo pipefail
          test -f dist-sha256.txt || { echo "the artifact carries no digest"; exit 1; }
          sha256sum --check --strict dist-sha256.txt

          sha="$(cut -d ' ' -f 1 < dist-sha256.txt)"
          bytes="$(wc -c < dist/index.html)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          {
            echo "### Published artifact"
            echo
            echo "| File | sha256 | Bytes |"
            echo "| --- | --- | --- |"
            echo "| \`dist/index.html\` | \`$sha\` | $bytes |"
            echo
            echo "From CI run [\`${{ steps.source.outputs.run_id }}\`](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ steps.source.outputs.run_id }}), commit \`${{ steps.source.outputs.commit }}\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke-test the artifact
        run: |
          set -euo pipefail

          # A build that emits a stub rather than the game is still non-empty.
          # The smallest plausible artifact is far above this floor — the flag
          # payload alone is over a megabyte — so the check costs nothing and
          # catches a truncated or half-written file.
          bytes="$(wc -c < dist/index.html)"
          test "$bytes" -ge 1000000 || { echo "dist/index.html is only $bytes bytes"; exit 1; }

          # Jekyll would reformat what it serves, which is a correctness issue
          # rather than hygiene: `selfDefending` invalidates a bundle edited
          # after obfuscation. The file is a dotfile, so its absence here would
          # mean CI uploaded without `include-hidden-files`.
          for path in .nojekyll 404.html LICENSE THIRD_PARTY_NOTICES.txt \
                      licenses/Apache-2.0.txt licenses/Noto-Emoji-NOTICE.txt; do
            test -f "dist/$path" || { echo "dist/$path is missing"; exit 1; }
          done

          # R8 is a property of everything published, not only of the game, so
          # both documents go through the build's own rule rather than a second
          # copy of it that could drift.
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            const { assertSelfContained } = await import('./scripts/build.ts');
            for (const file of ['dist/index.html', 'dist/404.html']) {
              assertSelfContained(readFileSync(file, 'utf8'));
              console.log(\`self-contained: \${file}\`);
            }
          "

          echo "Published directory:"
          find dist -type f | sort

      # An artifact deploy publishes exactly this directory and nothing else,
      # so a custom domain added later needs its `CNAME` written into `dist/`
      # by the build — otherwise the next deploy removes it. That decision is
      # open in the plan and has to be made before the first deploy, not after.
      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
