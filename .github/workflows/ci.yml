# Typecheck, dataset, unit suite, both builds and the browser suite, on every
# push and pull request — and the one artifact the deploy is allowed to publish.
#
# This job is the only place the published directory is built. `deploy.yml`
# does not rebuild it: it downloads what this job uploaded and checks the
# digest before publishing (R27, KTD18). That is what makes "the deployed
# artifact is the artifact CI tested" a fact rather than a convention — two
# builds of the same commit would almost certainly agree, `obfuscator.json`
# pins the seed precisely so they do, but "almost certainly" is not what the
# requirement says.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Read the tree, write nothing. Deploying is deploy.yml's job and its alone.
permissions:
  contents: read

# A newer push to the same ref makes the older run's verdict irrelevant — with
# one exception. A run on `main` may go on to deploy, and cancelling the caller
# cancels the called workflow with it, so a second push landing mid-publish
# would leave a half-applied Pages deployment. On `main` the older run is left
# to finish; everywhere else it is superseded.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    # The browser suite plays a real game with a twelve-second arrival flight;
    # the 360-minute default would let a hung Chromium sit for six hours.
    # The audio fixture renders 21 themes through OfflineAudioContext and the
    # styles gate walks 16 scenes at 8 widths twice; both are several times
    # slower here than on a developer machine.
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # KTD2/RISK-15: the golden fixtures encode one Node build's ICU output,
      # so the version comes from `.nvmrc` — the same pin developers use — and
      # never from a floating major.
      - name: Use the pinned Node version
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # R28: the dataset invariants are independent of any diff, and a broken
      # dataset should fail before the suites that read it.
      - name: Check the dataset
        run: npm run data:check


      - name: Unit suite
        run: npm test

      # `@playwright/test` is an exact version because `audio-golden.json` is a
      # digest of one Chromium build's synthesis. Reading that version out of
      # the installed tree rather than repeating it here means the bump that
      # changes the browser is the bump that misses the cache.
      - name: Resolve the pinned Playwright version
        id: playwright
        run: |
          version="$(node -p "require('./node_modules/@playwright/test/package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Playwright $version"

      - name: Restore the Chromium download
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      # Run this even on a cache hit: the cache holds the browser, not the apt
      # libraries `--with-deps` installs, and Playwright skips a download it
      # already has. Chromium only — no other engine has ever been verified.
      - name: Install Chromium and its system libraries
        run: npx playwright install --with-deps chromium

      # Both flavors, proven on every branch rather than only on main. The
      # readable one is what several browser specs open; the obfuscated one is
      # what the deploy publishes, and it is the one that can fail for reasons
      # the other cannot — a transform that breaks the bundle, or a published
      # file that moved out from under the notices.
      - name: Readable build
        run: npm run build:readable

      # `npm run test:browser` builds `dist/` itself, in Playwright's
      # `globalSetup`, so running the command here is not what produces the
      # artifact — it is what proves the command a developer runs still works,
      # and it fails before the suite rather than during it.
      - name: Published build
        run: npm run build

      # Four specs open `dist/`, one of them driving all 14,040 question
      # variants through the obfuscated bundle. The suite rebuilds the
      # directory once before the first worker starts, so what it tested and
      # what is uploaded below are the same bytes.
      #
      # The plan expected `styles.spec.ts` to be red here, because this runner
      # has neither Georgia nor Inter and the gate was imagined as a committed
      # snapshot of used values. U7 did not build it that way: it swaps the
      # `<style>` text between the frozen stylesheet and the split one inside
      # one browser at one moment and compares the two, so whatever fonts the
      # runner has cancel out on both sides. There is no fixture to recapture
      # and nothing to key by platform.
      - name: Browser suite
        run: npm run test:browser

      - name: Record the tested artifact
        id: artifact
        run: |
          sha="$(sha256sum dist/index.html | cut -d ' ' -f 1)"
          bytes="$(wc -c < dist/index.html)"
          printf '%s  dist/index.html\n' "$sha" > dist-sha256.txt
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          {
            echo "### Tested artifact"
            echo
            echo "| File | sha256 | Bytes |"
            echo "| --- | --- | --- |"
            echo "| \`dist/index.html\` | \`$sha\` | $bytes |"
          } >> "$GITHUB_STEP_SUMMARY"

      # `include-hidden-files` is not optional here: `.nojekyll` is a dotfile,
      # upload-artifact skips those by default, and a published directory
      # without it is one Jekyll will reformat — which invalidates a bundle
      # that defends itself against being edited.
      - name: Upload the tested artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: |
            dist/
            dist-sha256.txt
          include-hidden-files: true
          retention-days: 30

      # Under CI the config adds the HTML reporter to `list`, and keeps a trace
      # for any spec that failed. `playwright-report/` is the former and
      # `test-results/` the latter; both are uploaded because a failure that
      # only happens on this image is diagnosable from the trace and from
      # almost nothing else.
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  # ── Publish ─────────────────────────────────────────────────────────────
  # Only from `main`, only on a push, and only once `verify` is green — which
  # is the whole of R27: what goes live is the artifact the suites ran against,
  # uploaded by the job above, in this same run.
  #
  # Called rather than triggered. `deploy.yml` was `on: workflow_run` first and
  # every run was rejected at the environment gate, because a `workflow_run`
  # job executes in the default branch's context (`develop`) and the
  # `github-pages` environment allows `main` alone. A reusable workflow runs in
  # the caller's context, so `github.ref` here is the branch that actually
  # produced the artifact. `deploy.yml`'s header has the full account.
  #
  # `permissions` has to be granted by this job: a called workflow gets the
  # intersection of the caller's and its own, and this file's workflow-level
  # block is `contents: read`.
  deploy:
    name: Deploy
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
