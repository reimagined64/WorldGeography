<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10252b">
<meta name="description" content="Český zeměpisný kvíz inspirovaný World Geography pro C64. 195 zemí, glóbus a data pro rok 2026. Funguje offline.">
<title>World Geography — Arcade Edition 7.0</title>
<style>/*__CSS__*/</style>
</head>
<body>
<div class="app-shell">
<header class="header">
<button class="brand" id="brand" aria-label="World Geography – úvod"><svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="16"/><ellipse cx="20" cy="20" rx="7" ry="16"/><path d="M5 14h30M4 23h32M8 30h24"/></svg><span>WORLD<br>GEOGRAPHY</span></button>
<nav aria-label="Hlavní navigace"><button id="nav-play" class="nav-button active">Expedice</button><button id="nav-atlas" class="nav-button">Atlas</button><button id="nav-help" class="nav-button">Jak hrát</button></nav>
<div class="header-actions"><span class="edition">C64 REIMAGINED <i></i> 2026</span><button id="sound" class="icon-button sound-button" aria-label="Vypnout zvuk" aria-pressed="true" title="Vypnout zvuk (M)">♪</button><button id="sound-options" class="icon-button mixer-button" aria-label="Nastavení hudby a zvuků" title="Nastavení hudby a zvuků">≋</button></div>
</header>
<main id="main">
<section id="main-view" class="main-grid">
<div class="world-panel">
<div id="world-heading" class="world-heading"></div>
<div class="canvas-wrap"><canvas id="globe" role="img" aria-label="Otočný zeměpisný glóbus"></canvas><div id="flight-status" class="flight-status" role="status" hidden></div><div class="globe-controls" aria-label="Ovládání glóbu"><button id="zoom-out" aria-label="Oddálit glóbus">−</button><button id="globe-reset" aria-label="Vystředit glóbus" title="Vystředit">◎</button><button id="zoom-in" aria-label="Přiblížit glóbus">+</button></div></div>
<div id="world-caption" class="world-caption"></div>
<div class="map-legend"><span><i></i> pevnina</span><span class="target-legend"><i></i> hledaná země</span><span>Tažením otočíte glóbus</span></div>
</div>
<div id="side-panel" class="side-panel"></div>
</section>
<section id="results-view" hidden></section>
</main>
<footer class="footer"><span>INSPIROVÁNO ROKEM 1985. PŘIPRAVENO PRO DNEŠEK.</span><button id="data-button">Data & zdroje <span>↗</span></button><span class="offline"><i></i> BEZ INTERNETU · BEZ REKLAM</span></footer>
</div>
<dialog id="dialog" aria-labelledby="dialog-title"><div class="dialog-top"><span class="eyebrow">WORLD GEOGRAPHY / INFORMACE</span><button id="dialog-close" class="icon-button" aria-label="Zavřít okno">×</button></div><div id="dialog-content"></div></dialog>
<div id="mobile-hud" class="mobile-hud" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>
<noscript><div class="no-js">Pro hraní je potřeba zapnout JavaScript. Hra neodesílá žádná data na internet.</div></noscript>
<script id="license-data" type="text/plain">/*__NOTICES__*/</script>
<script id="country-data" type="application/json">/*__COUNTRIES__*/</script>
<script id="flag-data" type="application/json">/*__FLAGS__*/</script>
<script id="map-data" type="application/json">/*__MAP__*/</script>
<script id="source-data" type="application/json">/*__SOURCES__*/</script>
<script>/*__CORE__*/</script><script>/*__CLOCK__*/</script><script>/*__AUDIO__*/</script><script>/*__GLOBE__*/</script><script>/*__APP__*/</script>
</body></html>
